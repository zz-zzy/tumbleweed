baseURL = "https://zz-zzy.github.io/tumbleweed/"
title = "Tumbleweed"
theme = "PaperMod"

# 默认中文，中文内容挂在根路径 /，英文挂在 /en/
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
summaryLength = 120

[pagination]
  pagerSize = 12

# 站内搜索需要 home 输出 JSON
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[params]
  env = "production"
  author = "zz-zzy"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  mainSections = ["posts"]

  ShowReadingTime = true
  ShowWordCount = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  displayFullLangName = true

  # 评论：由 layouts/_partials/comments.html 实现（utterances）
  comments = true

  # 公式：文章 front matter 写 math: true 时按需加载 MathJax
  math = false

[params.assets]
  favicon = "favicon.svg"
  favicon16x16 = "favicon.svg"
  favicon32x32 = "favicon.svg"
  apple_touch_icon = "favicon.svg"
  safari_pinned_tab = "favicon.svg"

[params.utterances]
  repo = "zz-zzy/tumbleweed"
  issueTerm = "pathname"
  label = "comment"
  theme = "preferred-color-scheme"

[params.fuseOpts]
  isCaseSensitive = false
  ignoreDiacritics = true
  ignoreLocation = true
  minMatchCharLength = 1
  shouldSort = false
  threshold = 0.3
  keys = ["title", "permalink", "summary", "content"]

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/zz-zzy"

[[params.socialIcons]]
  name = "rss"
  url = "https://zz-zzy.github.io/tumbleweed/index.xml"

# ---------------------------------------------------------------------------
# 中文（默认语言，根路径）
# ---------------------------------------------------------------------------
[languages.zh-cn]
  label = "中文"
  locale = "zh-CN"
  contentDir = "content/zh-cn"
  weight = 1
  title = "Tumbleweed"

  [languages.zh-cn.params]
    description = "AI Agent / RAG / LLM 工程的技术笔记与思考。"

  [languages.zh-cn.params.profileMode]
    enabled = true
    title = "Tumbleweed"
    subtitle = "AI Agent / RAG / LLM 工程笔记。写代码，也写字。"
    imageUrl = "img/avatar.svg"
    imageTitle = "Tumbleweed"

  [[languages.zh-cn.params.profileMode.buttons]]
    name = "文章"
    url = "posts/"

  [[languages.zh-cn.params.profileMode.buttons]]
    name = "关于"
    url = "about/"

  [[languages.zh-cn.menu.main]]
    identifier = "posts"
    name = "文章"
    url = "posts/"
    weight = 10

  [[languages.zh-cn.menu.main]]
    identifier = "series"
    name = "系列"
    url = "series/"
    weight = 20

  [[languages.zh-cn.menu.main]]
    identifier = "tags"
    name = "标签"
    url = "tags/"
    weight = 30

  [[languages.zh-cn.menu.main]]
    identifier = "archives"
    name = "归档"
    url = "archives/"
    weight = 40

  [[languages.zh-cn.menu.main]]
    identifier = "search"
    name = "搜索"
    url = "search/"
    weight = 50

  [[languages.zh-cn.menu.main]]
    identifier = "about"
    name = "关于"
    url = "about/"
    weight = 60

# ---------------------------------------------------------------------------
# English（/en/）
# ---------------------------------------------------------------------------
[languages.en]
  label = "English"
  locale = "en-US"
  contentDir = "content/en"
  weight = 2
  title = "Tumbleweed"

  [languages.en.params]
    description = "Notes on AI agents, RAG and LLM engineering."

  [languages.en.params.profileMode]
    enabled = true
    title = "Tumbleweed"
    subtitle = "Notes on AI agents, RAG and LLM engineering."
    imageUrl = "img/avatar.svg"
    imageTitle = "Tumbleweed"

  [[languages.en.params.profileMode.buttons]]
    name = "Posts"
    url = "posts/"

  [[languages.en.params.profileMode.buttons]]
    name = "About"
    url = "about/"

  [[languages.en.menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "posts/"
    weight = 10

  [[languages.en.menu.main]]
    identifier = "series"
    name = "Series"
    url = "series/"
    weight = 20

  [[languages.en.menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "tags/"
    weight = 30

  [[languages.en.menu.main]]
    identifier = "archives"
    name = "Archive"
    url = "archives/"
    weight = 40

  [[languages.en.menu.main]]
    identifier = "search"
    name = "Search"
    url = "search/"
    weight = 50

  [[languages.en.menu.main]]
    identifier = "about"
    name = "About"
    url = "about/"
    weight = 60

[services.googleAnalytics]
  # 想启用统计时填入 GA4 的 Measurement ID，例如 "G-XXXXXXXXXX"
  ID = ""
